<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot demo</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #0a0a0f; color: #c0c0c0; font-family: system-ui, sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.5rem; line-height: 1.6; }
    h1 { color: #ffffff; }
  </style>
</head>
<body>
  <main>
    <h1>Chatbot demo</h1>
    <p>The widget opens from the button in the bottom right corner.</p>
    <p>Change the <code>lang</code> attribute of <code>&lt;html&gt;</code> to <code>fi</code> to see the Finnish texts.</p>
  </main>

  <!-- Optional: override the built-in texts per language. -->
  <script>
    window.oacChatbot = {
      strings: {
        en: { title: 'Example Assistant' }
      }
    };
  </script>

  <!-- The only line a page needs. -->
  <script src="chatbot/chatbot.js" defer></script>
</body>
</html>
